[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vuls"
version = "0.1.0"
description = "Telegram-first AI Product Builder MVP."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.15",
  "fastapi>=0.115",
  "openai>=1.90",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "supabase>=2.15",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
vuls = "vuls.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vuls"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["vuls"]
